<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Salário Líquido</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #eef2f6; color: #1a202c; }
    header { background: #1a365d; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 520px; margin: 36px auto; }
    .card { background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 8px 24px rgba(26,54,93,.08); }
    h2 { margin: 0 0 8px; color: #1a365d; font-size: 22px; }
    .hint { color: #4a5568; font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
    input[type=text], input[type=number] {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px;
    }
    button, input[type=submit] {
      margin-top: 18px; width: 100%; background: #2b6cb0; color: #fff; border: 0;
      padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .regras { margin-top: 18px; font-size: 12px; color: #4a5568; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>Calculadora de Salário Líquido</h1>
    <p>Flask · Aula prática A4 · Framework Python</p>
  </header>
  <main>
    <div class="card">
      <h2>Informe os dados</h2>
      <p class="hint">Regras simplificadas da aula: INSS 8%, IR 15% acima de R$ 2.500,00 e R$ 200,00 por dependente.</p>
      <form action="/resultado" method="post">
        <label for="salario">Salário bruto (R$)</label>
        <input type="text" id="salario" name="salario" placeholder="Ex.: 3000.00">
        <label for="dependentes">Número de dependentes</label>
        <input type="number" id="dependentes" name="dependentes" placeholder="Ex.: 2">
        <input type="submit" value="Calcular">
      </form>
      <div class="regras">
        Líquido = bruto − INSS − IR + (dependentes × 200).<br>
        IR só incide se o salário bruto for maior que R$ 2.500,00.
      </div>
    </div>
  </main>
</body>
</html>
